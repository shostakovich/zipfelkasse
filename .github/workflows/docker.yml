name: Build and publish container

# Every non-PR build pushes `sha-<commit>`; `latest` moves only for the commit still at main's head.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docker-pr-{0}', github.ref) || 'docker-publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    # Pull requests are tested by the CI workflow itself.
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    # The test job is skipped on pull requests; a failed or cancelled one still stops the build.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: zipfelkasse:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        id: smoke
        run: |
          docker run -d --name zipfelkasse -p 4000:4000 \
            -e SECRET_KEY_BASE="$(openssl rand -hex 64)" \
            -e PHX_HOST=localhost \
            zipfelkasse:smoke
          timeout 120 sh -c 'until curl -fsS -o /dev/null http://localhost:4000/up; do sleep 2; done'
          # /up only queries the database; /who renders the layout with its images and font.
          for path in /who /setzkasten/fonts/Figtree-Variable.woff2; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' -H 'X-Forwarded-Proto: https' \
              "http://localhost:4000$path")
            if [ "$status" != 200 ]; then
              echo "::error::GET $path returned $status"
              exit 1
            fi
          done
          # The database holds the YNAB tokens.
          modes=$(docker exec zipfelkasse sh -c 'stat -c %a /app/data/zipfelkasse.sqlite3*' | sort -u)
          if [ "$modes" != 600 ]; then
            echo "::error::the database files have modes $modes instead of 600"
            exit 1
          fi
          # Only the app's port: no EPMD (4369) and no Erlang distribution port.
          ports=$(docker exec zipfelkasse cat /proc/net/tcp /proc/net/tcp6 |
            awk '$4 == "0A" { split($2, a, ":"); print a[2] }' | sort -u)
          if [ "$ports" != 0FA0 ]; then
            echo "::error::the container listens on the ports (hex) $ports instead of only 4000"
            exit 1
          fi

      - name: Show container logs
        if: failure() && steps.smoke.outcome == 'failure'
        run: docker logs zipfelkasse

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check that this commit is still the head of main
        if: github.event_name != 'pull_request'
        id: head
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$head" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ steps.head.outputs.latest }}
            type=sha,prefix=sha-

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
