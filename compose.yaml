services:
  zipfelkasse:
    build: .
    image: zipfelkasse:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Europe/Berlin
      MCP_SECRET: ${MCP_SECRET:-}
      # MCP_ALLOWED_CIDRS: 160.79.104.0/21
      # Only the address of the Newt/Pangolin container as /32, not the whole
      # Docker network – otherwise any container on the network could forge
      # X-Forwarded-For. Address: log line "mcp: IP not allowed … remote=…" or
      # docker inspect (see docs/MCP.md).
      # TRUSTED_PROXIES: 172.18.0.5/32
    volumes:
      - zipfelkasse-data:/data

volumes:
  zipfelkasse-data:
