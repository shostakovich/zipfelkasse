{{define "content"}}
<div class="stack">
  <section class="card">
    <div class="card-header">
      <h1 class="card-title">Einstellungen</h1>
      <p class="card-description">Gruppe, Personen, Kategorien und mehr.</p>
    </div>
    <div class="card-content">
      <form method="post" action="/einstellungen" class="form">
        <div class="field">
          <label for="gruppenname">Name der Gruppe</label>
          <div class="inline-form">
            <input id="gruppenname" name="gruppenname" value="{{.Data.GroupName}}" required maxlength="60">
            <button class="btn btn-primary" type="submit">Speichern</button>
          </div>
        </div>
      </form>
    </div>
  </section>

  <section class="card">
    <div class="card-content">
      <ul class="link-list">
        <li><a href="/einstellungen/teilnehmer">{{icon "users"}} Teilnehmer</a></li>
        <li><a href="/einstellungen/kategorien">{{icon "tag"}} Kategorien</a></li>
        <li><a href="/einstellungen/wiederkehrend">{{icon "repeat"}} Wiederkehrende Ausgaben</a></li>
        <li><a href="/einstellungen/kurse">{{icon "banknote"}} Wechselkurse</a></li>
        <li><a href="/einstellungen/ynab">{{icon "receipt"}} YNAB</a></li>
        <li><a href="/export">{{icon "archive"}} Export</a></li>
      </ul>
    </div>
  </section>
</div>
{{end}}
