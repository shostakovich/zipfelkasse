{{define "content"}}
<div class="stack">
  <section class="card">
    <div class="card-header">
      <h1 class="card-title">Wer bist du?</h1>
      <p class="card-description">Wähle dich aus. Die App merkt sich das auf diesem Gerät.</p>
    </div>
    <div class="card-content">
      {{- if .Data.Participants}}
      <form method="post" action="/wer" class="stack-sm">
        <input type="hidden" name="zurueck" value="{{.Data.Return}}">
        {{- range .Data.Participants}}
        <button class="btn btn-outline btn-block btn-lg" type="submit" name="id" value="{{.ID}}"
          {{- if and $.Me (eq $.Me.ID .ID)}} aria-current="true"{{end}}>{{.Name}}</button>
        {{- end}}
      </form>
      {{- else}}
      <p class="muted">Noch niemand da. Leg dich unten als erste Person an.</p>
      {{- end}}
    </div>
  </section>

  <section class="card">
    <div class="card-header">
      <h2 class="card-title">Neue Person</h2>
    </div>
    <div class="card-content">
      <form method="post" action="/wer/neu" class="form">
        <input type="hidden" name="zurueck" value="{{.Data.Return}}">
        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" value="{{.Data.Name}}" required maxlength="60" autocomplete="given-name">
        </div>
        <button class="btn btn-primary btn-block" type="submit">Anlegen und auswählen</button>
      </form>
    </div>
  </section>
</div>
{{end}}
